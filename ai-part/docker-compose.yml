version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bahrain-stats-agent
    ports:
      - "7860:7860"
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - data-volume:/app/data
      - logs-volume:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  data-volume:
  logs-volume:
